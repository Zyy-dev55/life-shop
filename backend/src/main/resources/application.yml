server:
  port: 8080

spring:
  application:
    name: life-shop-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/life_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# 业务配置
lifeshop:
  jwt:
    secret: LifeShopSecretKey2026ForJwtTokenMustBeLongEnough
    expire: 604800000          # token 有效期(毫秒)，7 天
  order:
    freight: 10                # 基础运费
    free-freight-threshold: 99 # 满多少免运费

logging:
  level:
    com.lifeshop: debug
